<ion-header>
  <ion-toolbar>
    <ion-title>Filtros</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-label position="floating">Categoría</ion-label>
    <ion-select [(ngModel)]="filter.category">
      <ion-select-option *ngFor="let category of categories" [value]="category">
        {{ category }}
      </ion-select-option>
    </ion-select>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Ubicación</ion-label>
    <ion-input type="text" [(ngModel)]="filter.location"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Precio mínimo</ion-label>
    <ion-input type="number" [(ngModel)]="filter.minPrice"></ion-input>
  </ion-item>

  <ion-item>
    <ion-label position="floating">Precio máximo</ion-label>
    <ion-input type="number" [(ngModel)]="filter.maxPrice"></ion-input>
  </ion-item>

  <div class="actions">
    <ion-button expand="block" fill="outline" (click)="clear()">Limpiar</ion-button>
    <ion-button expand="block" (click)="apply()">Aplicar</ion-button>
  </div>
</ion-content>
