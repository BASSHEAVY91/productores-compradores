<ion-header>
  <ion-toolbar>
    <ion-title>Catálogo</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/comprador/purchases" aria-label="Mis compras">
        <ion-icon name="receipt-outline" slot="icon-only"></ion-icon>
      </ion-button>
      <ion-button (click)="logout()">
        <ion-icon name="log-out-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar
      [(ngModel)]="searchTerm"
      (ionInput)="onSearch()"
      placeholder="Buscar producto"
    ></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-button fill="outline" size="small" (click)="goToFilters()">
    <ion-icon name="options-outline" slot="start"></ion-icon>
    Filtros
    <ion-badge *ngIf="filters.activeCount > 0" class="filter-count">
      {{ filters.activeCount }}
    </ion-badge>
  </ion-button>

  <div class="categories">
    <ion-chip
      *ngFor="let category of categories"
      [color]="isActiveCategory(category) ? 'primary' : undefined"
      [outline]="!isActiveCategory(category)"
      (click)="toggleCategory(category)"
    >
      <ion-icon *ngIf="isActiveCategory(category)" name="checkmark"></ion-icon>
      <ion-label>{{ category }}</ion-label>
    </ion-chip>
  </div>

  <div class="active-filters" *ngIf="activeFiltersText">
    <span>Filtrando por: {{ activeFiltersText }}</span>
    <ion-button fill="clear" size="small" (click)="clearFilters()">Quitar filtros</ion-button>
  </div>

  <ion-list>
    <ion-item *ngFor="let product of products" button (click)="openDetail(product)">
      <ion-thumbnail slot="start" *ngIf="product.photoUrl">
        <img [src]="product.photoUrl" [alt]="product.name" />
      </ion-thumbnail>
      <ion-label>
        <h2>{{ product.name }}</h2>
        <p>${{ product.price }} · {{ product.location }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <div class="empty-state" *ngIf="!loading && products.length === 0">
    <ion-icon name="search-outline"></ion-icon>
    <p>No se encontraron productos.</p>
    <ion-button fill="clear" *ngIf="filters.activeCount > 0" (click)="clearFilters()">
      Quitar filtros
    </ion-button>
  </div>
</ion-content>
