<ion-header>
  <ion-toolbar>
    <ion-title>Mis productos</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="goToProfile()">
        <ion-icon name="person-circle-outline" slot="icon-only"></ion-icon>
      </ion-button>
      <ion-button (click)="logout()">
        <ion-icon name="log-out-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list *ngIf="products.length > 0">
    <ion-item-sliding *ngFor="let product of products">
      <ion-item>
        <ion-thumbnail slot="start" *ngIf="product.photoUrl">
          <img [src]="product.photoUrl" [alt]="product.name" />
        </ion-thumbnail>
        <ion-label>
          <h2>{{ product.name }}</h2>
          <p>
            ${{ product.price }} · {{ product.quantityAvailable }} disponibles
          </p>
        </ion-label>
        <ion-button slot="end" fill="clear" (click)="edit(product)">
          <ion-icon name="create-outline" slot="icon-only"></ion-icon>
        </ion-button>
      </ion-item>
      <ion-item-options side="end">
        <ion-item-option color="primary" (click)="edit(product)"
          >Editar</ion-item-option
        >
        <ion-item-option color="danger" (click)="deactivate(product)"
          >Desactivar</ion-item-option
        >
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>

  <div class="empty-state" *ngIf="!loading && products.length === 0">
    <ion-icon name="basket-outline"></ion-icon>
    <p>Aún no has publicado productos.</p>
  </div>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="publish()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
