<ion-header>
  <ion-toolbar>
    <ion-title>Del Campo a Tu Mesa</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-segment [value]="mode" (ionChange)="setMode($event.detail.value)">
    <ion-segment-button value="login">
      <ion-label>Iniciar sesión</ion-label>
    </ion-segment-button>
    <ion-segment-button value="register">
      <ion-label>Registrarme</ion-label>
    </ion-segment-button>
  </ion-segment>

  <form [formGroup]="form" (ngSubmit)="submit()" class="ion-margin-top">
    <ion-item *ngIf="mode === 'register'">
      <ion-input
        label="Nombre"
        labelPlacement="floating"
        type="text"
        formControlName="name"
      ></ion-input>
    </ion-item>

    <ion-item>
      <ion-input
        label="Correo electrónico"
        labelPlacement="floating"
        type="email"
        formControlName="email"
      ></ion-input>
    </ion-item>

    <ion-item>
      <ion-input
        [label]="mode === 'recover' ? 'Nueva contraseña' : 'Contraseña'"
        labelPlacement="floating"
        type="password"
        formControlName="password"
      ></ion-input>
    </ion-item>

    <ion-text color="danger" *ngIf="errorMessage">
      <p class="ion-padding-top">{{ errorMessage }}</p>
    </ion-text>

    <ion-text color="success" *ngIf="successMessage">
      <p class="ion-padding-top">{{ successMessage }}</p>
    </ion-text>

    <ion-button
      expand="block"
      type="submit"
      class="ion-margin-top"
      [disabled]="form.invalid || loading"
    >
      <ng-container *ngIf="mode === 'login'">Continuar</ng-container>
      <ng-container *ngIf="mode === 'register'">Crear cuenta</ng-container>
      <ng-container *ngIf="mode === 'recover'"
        >Actualizar contraseña</ng-container
      >
    </ion-button>

    <ion-button
      *ngIf="mode !== 'recover'"
      expand="block"
      fill="clear"
      size="small"
      (click)="setMode('recover')"
    >
      ¿Olvidaste tu contraseña?
    </ion-button>

    <ion-button
      *ngIf="mode === 'recover'"
      expand="block"
      fill="clear"
      size="small"
      (click)="setMode('login')"
    >
      Volver a iniciar sesión
    </ion-button>
  </form>
</ion-content>
